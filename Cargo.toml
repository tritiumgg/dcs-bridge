# Four crates: the broker, its Lua entry point, the CLI and the generator.
#
# The version below is the release version, and it is the only version this
# file holds. The bridge carries five others — the protocol, the interface, the
# grammar, the state and the schema hash — and each lives with the code that
# compares it, because none of them moves when a release is cut.
# .github/workflows/version-bump.yml fails if a bump reaches any of them.

[workspace]
resolver = "3"
members = ["crates/broker", "crates/cli", "crates/generator", "crates/lua-module"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
license = "MIT"
repository = "https://github.com/tritiumgg/dcs-bridge"
authors = ["tritiumgg"]

# A parser fault must drop one connection rather than the process, so the
# broker unwinds. Stated here because this is the profile somebody would set to
# abort instead. The CI `guards` job greps every Cargo.toml for that setting
# and fails the build, so do not name it in a comment either.
[profile.release]
panic = "unwind"

# The broker is a DLL in someone else's process doing raw FFI into Lua, so the
# unsafe hygiene lints earn their place across the workspace.
[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "warn"
# `--cfg loom` swaps the broker's atomics for Loom's models of them, so the
# compiler is told the flag is one this workspace sets rather than a typo.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
