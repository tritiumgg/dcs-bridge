# dcsb is one binary with nine verbs. It runs outside the DCS process and links
# no part of the broker: what it knows of the wire it decodes through a stock
# protobuf library, so a misreading in the encoder cannot be shared by the tool
# that checks it. The broker is reached only by the tests, which stand a real
# listener up over loopback. The topic names are shared, through
# dcsbridge-topic, because a name is not encoder logic and a wrong one is
# caught by that crate's test against the schema.

[package]
name = "dcsb"
description = "The DCS-Bridge CLI: observe a running bridge and diagnose a broken one."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "dcsb"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
dcsbridge-topic = { path = "../topic" }
prost = "0.14"
prost-types = "0.14"
# The schema hash, checked against the one the handshake carries. The
# broker pins sha2 to its portable backend because it runs inside DCS
# (ADR 0020); dcsb runs outside it, so the default backend is fine here.
sha2 = "0.10"

[dev-dependencies]
dcsbridge-broker = { path = "../broker" }

[lints]
workspace = true
