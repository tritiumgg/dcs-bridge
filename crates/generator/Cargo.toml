# protoc-gen-dcsbridge-lua is a protoc plugin. protoc resolves a plugin by
# executable name, so the binary name is fixed by that contract.

[package]
name = "protoc-gen-dcsbridge-lua"
description = "The DCS-Bridge protoc plugin: emits the bridge's Lua artefacts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "protoc-gen-dcsbridge-lua"
path = "src/main.rs"

[dependencies]
# The plugin runs on the build machine and never inside DCS, so it takes the
# protobuf runtime it needs (ADR 0016).
prost = "0.14"
prost-types = "0.14"

[lints]
workspace = true
