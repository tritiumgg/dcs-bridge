syntax = "proto3";

// An adopter's schema, generated into a pair of files of its own beside the
// shipped pair. It holds a record with a field of each kind and both
// repeated kinds, a command with a typed reply, a hook-side record, and a
// hook-side command with a field of every kind a decoder reads.
package fixture.adopter;

import "dcsbridge/broker/broker.proto";

message RocketImpact {
  option (dcsbridge.broker.record_class) = RECORD_CLASS_LOSSY;
  option (dcsbridge.broker.required_capability) = CAPABILITY_READ;

  string weapon = 1;
  repeated int32 hit_ids = 2;
  repeated Point craters = 3;
  optional double yield = 4;
  bool fused = 5;
  Fuze fuze = 6;
  bytes tag = 7;
  Point at = 8;
}

// A field type: it carries no option.
message Point {
  double x = 1;
  double z = 2;
}

enum Fuze {
  FUZE_UNSPECIFIED = 0;
  FUZE_IMPACT = 1;
  FUZE_PROXIMITY = 2;
}

message GetPosition {
  option (dcsbridge.broker.record_class) = RECORD_CLASS_COMMAND;
  option (dcsbridge.broker.required_capability) = CAPABILITY_COMMAND;
  option (dcsbridge.broker.reply_to) = "Position";

  uint64 request_id = 1;
  string unit_name = 2;
}

message Position {
  option (dcsbridge.broker.record_class) = RECORD_CLASS_DURABLE;
  option (dcsbridge.broker.required_capability) = CAPABILITY_READ;

  uint64 request_id = 1;
  Point at = 2;
}

message Chat {
  option (dcsbridge.broker.record_class) = RECORD_CLASS_DURABLE;
  option (dcsbridge.broker.required_capability) = CAPABILITY_READ;
  option (dcsbridge.broker.target) = TARGET_HOOK_DRIVER;

  string text = 1;
}

message SetPath {
  option (dcsbridge.broker.record_class) = RECORD_CLASS_COMMAND;
  option (dcsbridge.broker.required_capability) = CAPABILITY_COMMAND;
  option (dcsbridge.broker.target) = TARGET_HOOK_DRIVER;

  string name = 1;
  uint32 flags = 2;
  uint64 serial = 3;
  int32 count = 4;
  int64 offset = 5;
  Fuze fuze = 6;
  bool loop = 7;
  double speed = 8;
  optional int32 limit = 9;
  repeated int32 ids = 10;
  repeated Point waypoints = 11;
  Point origin = 12;
  Node tree = 13;
  sint32 dx = 14;
  sint64 dy = 15;
  float scale = 16;
  fixed32 mask = 17;
  fixed64 seed = 18;
  sfixed32 bias = 19;
  sfixed64 drift = 20;
  map<string, int32> tags = 21;
  oneof pick {
    int32 by_count = 22;
    string by_name = 23;
  }
}

// A field type that contains itself, reached only by SetPath. Its map is
// merged when tree arrives twice.
message Node {
  repeated Node children = 1;
  int32 v = 2;
  map<string, int32> labels = 3;
}
