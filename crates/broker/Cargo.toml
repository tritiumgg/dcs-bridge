# The broker, the first of the bridge's three components. Rings, threads,
# framing and the drop policy live here, and none of it touches DCS or Lua.
#
# A plain rlib with no FFI, which is what lets the broker's behaviour be tested
# on a machine with no DCS: the crate links into a test binary on any host with
# no undefined symbols to resolve. The Lua entry point that carries this code into
# a Lua state is crates/lua-module, and it is a cdylib so that nothing links it
# into an executable. ADR 0005.

[package]
name = "dcsbridge-broker"
description = "The DCS-Bridge broker: rings, threads and the framed TCP transport."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]

# The tests decode the encoder's output through a stock protobuf library,
# because a decoder written beside the encoder would share its misreadings.
# A dev-dependency reaches no shipped build, so the broker still links no
# protobuf runtime. prost-types carries the library's own `Any`, so the type
# URL is read the way every consumer reads it.
[dev-dependencies]
prost = "0.14"
prost-types = "0.14"

# Loom reaches the broker only under `--cfg loom`, which no shipped build sets,
# so the artifact that goes into DCS keeps no dependency at all.
[target.'cfg(loom)'.dev-dependencies]
loom = "0.7"

[lints]
workspace = true
