# Component 1 of SPEC 2: the broker. Rings, threads, framing and the drop
# policy live here, and none of it touches DCS or Lua.
#
# A plain rlib with no FFI, which is what lets SPEC 17's *Any (native module)*
# rows run anywhere: the crate links into a test binary on any host with no
# undefined symbols to resolve. The Lua entry point that carries this code into
# a Lua state is crates/lua-module, and it is a cdylib so that nothing links it
# into an executable. ADR 0005.

[package]
name = "dcsbridge-broker"
description = "The DCS-Bridge broker: rings, threads and the framed TCP transport."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]

