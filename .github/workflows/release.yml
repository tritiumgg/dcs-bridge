# Tag-triggered. Cross-builds the Windows target, stages the artifacts, and
# publishes the broker, the CLI, the write-directory zip and the checksums.
#
# A tag carrying a hyphenated suffix, such as v0.2.0-rc1, publishes as a
# prerelease, which is the development channel.
#
# tools/stage-release.sh does the staging, and ci.yml's cross-build runs the
# same script on every pull request, so the path a tag takes is exercised long
# before a tag takes it.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag to build
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      # The tag reaches the shell through the environment rather than through
      # expansion, so its text cannot become script.
      - name: Resolve the tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          set -eu
          tag="$INPUT_TAG"
          [ -n "$tag" ] || tag="${GITHUB_REF#refs/tags/}"
          case "$tag" in
            v[0-9]*) ;;
            *) echo "not a release tag: $tag" >&2; exit 1 ;;
          esac
          case "$tag" in
            *[!A-Za-z0-9.-]*)
              echo "the tag carries characters a version may not: $tag" >&2
              exit 1 ;;
          esac
          case "$tag" in
            *-*) channel=prerelease ;;
            *)   channel=release ;;
          esac
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'channel=%s\n' "$channel" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Toolchain
        run: rustup show

      - name: LLVM
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends llvm clang lld

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-xwin
            ~/.cache/cargo-xwin
          key: release-xwin-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: release-xwin-

      - name: cargo-xwin
        run: command -v cargo-xwin || cargo install --locked cargo-xwin

      - name: Import library from the checked-in .def
        run: sh tools/mkimplib.sh

      # schema.pb ships inside the write-directory zip, so the staging below
      # needs it.
      - uses: ./.github/actions/buf
      - name: Schema
        run: sh tools/mkschema.sh

      - name: Build
        run: cargo xwin build --release --workspace --target x86_64-pc-windows-msvc

      # The version comes from the tag rather than from Cargo.toml, so a
      # prerelease zip carries the tag's own suffix.
      - name: Stage the artifacts
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          sh tools/stage-release.sh \
             target/x86_64-pc-windows-msvc/release "$VERSION" dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          CHANNEL: ${{ steps.tag.outputs.channel }}
        run: |
          set -eu
          flags=""
          if [ "$CHANNEL" = prerelease ]; then
            flags="--prerelease"
          fi
          gh release create "$TAG" dist/* \
            --title "$TAG" \
            --generate-notes \
            $flags
