# Rust is configured in rust-toolchain.toml, not here.
#
# mise's rust tool is a symlink to rustup's shims plus three environment
# variables, one of which is RUSTUP_TOOLCHAIN. That variable overrides
# rust-toolchain.toml outright, and an override discards the file's
# `components` and `targets` — so clippy, rustfmt and the Windows target go
# missing while the version still looks correct. mise has no setting for
# either list, so the file has to be the one in charge.
#
# Clearing RUSTUP_TOOLCHAIN puts it back in charge, and the idiomatic version
# file setting lets mise read the version from it. mise still installs and
# manages the toolchain: `mise ls` sources rust from rust-toolchain.toml, and
# `mise install` provisions whatever channel that file names.
#
# So `mise use rust@<version>` is the wrong move here — it writes a second
# version into [tools] below and mise stops reading the file. Edit `channel`
# in rust-toolchain.toml instead.

[settings]
idiomatic_version_file_enable_tools = ["rust"]

[env]
RUSTUP_TOOLCHAIN = ""

[tools]
buf = "1.72.0"
lua = "5.1"

# --no-default-features below turns the Lua module's dcs-lua feature off, which
# is what the host-native build is. Leaving it on links DCS's lua.dll into the
# module on a Windows host, and a machine with no DCS has none to load.
# ADR 0002, ADR 0006.

[tasks.build]
description = "Build every crate in the workspace"
run = "cargo build --workspace --all-targets --no-default-features"

[tasks.test]
description = "Run the workspace test suite"
run = "cargo test --workspace --no-default-features"

[tasks.lua]
description = "Open the host-native module with a stock Lua 5.1"
run = "sh tools/luatest.sh"

[tasks.fmt]
description = "Format every crate"
run = "cargo fmt --all"

[tasks.check]
description = "What CI gates a pull request on, against the host target"
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets --no-default-features -- -D warnings",
  "cargo build --workspace --all-targets --no-default-features",
  "cargo test --workspace --no-default-features",
  "sh tools/luatest.sh",
  "sh tools/nospecrefs.sh",
]

[tasks.schema]
description = "Check the .proto tree and compile target/schema.pb"
run = [
  "buf lint",
  "sh tools/schema-ownership.sh",
  "sh tools/schema-breaking.sh",
  "sh tools/mkschema.sh",
]

[tasks.loom]
description = "Enumerate the ring's interleavings with Loom"
env = { RUSTFLAGS = "--cfg loom -D warnings" }
run = "cargo test -p dcsbridge-broker --no-default-features --lib ring::loom"

[tasks.windows]
description = "Cross-build the product target, linking DCS's Lua"
run = "cargo xwin build --release --workspace --target x86_64-pc-windows-msvc"

[tasks.docs]
description = "Lint the ledgers and hold STATE.md to its budget"
run = [
  "sh tools/ledger.sh lint",
  "sh tools/statecheck.sh",
]
