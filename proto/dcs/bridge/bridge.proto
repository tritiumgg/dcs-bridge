syntax = "proto3";

// This package is bounded: the only messages permitted here are the bridge's
// own records and the nested types those records carry.
// A built-in set's record belongs in dcs.builtin and an adopter's in a package
// they own. tools/schema-ownership.sh holds the list and enforces it.
package dcs.bridge;

import "google/protobuf/any.proto";
import "google/protobuf/descriptor.proto";

// One frame on the broker-to-consumer interface is one Envelope, behind a
// little-endian u32 length prefix.
//
// The Envelope names no payload type. A record type is added by writing its
// message and nothing else, because the type URL protobuf already writes into
// the Any is the topic id: type.googleapis.com/<package>.<Message>. No topic
// number is allocated, no registry is coordinated, and no shared file changes.
//
// epoch and mission_time are optional because zero is a wrong answer for both
// rather than a meaningful one. A record emitted outside any epoch omits them.
// A consumer reads an absent epoch as "not epoch-scoped" and keeps the record,
// and an absent mission time as "the sim is not running".
message Envelope {
  uint64 seq = 1;
  optional uint32 epoch = 2;
  optional double mission_time = 3;
  google.protobuf.Any payload = 4;
}

// The first frame on every connection, at seq 1, before anything has
// authenticated. It says that a bridge is here and which build of it, and
// nothing about the mission: that is everything an unauthenticated peer
// learns.
//
// protocol is the one version a consumer compares. The broker states it and
// refuses nothing; what to do about a mismatch is the consumer's choice.
// broker names the build for a bug report and is compared by nobody.
// instance_id names the broker process: a consumer that reconnects and reads
// a different one is talking to a restarted broker, whose seq origin is new.
// schema_sha256 is the SHA-256 of the FileDescriptorSet GetSchema serves, and
// is absent until the hook driver has handed that set over.
message Handshake {
  uint32 protocol = 1;
  string broker = 2;
  uint64 instance_id = 3;
  optional bytes schema_sha256 = 4;
}

// Liveness, asked by a consumer and answered by the broker itself: the one
// message a connection may send before it has authenticated besides Auth.
// Nothing about it reaches Lua, and it carries no record class.
message Ping {}

// What answers a Ping. It reports the sim's liveness and not the broker's:
// the broker answers from its own thread, so a wedged logic thread with a
// live reader thread reads as dcs_alive false, which is the case Ping exists
// to detect.
//
// dcs_last_heard_ms is the age of the logic thread's last heartbeat and is
// absent when there has not been one. dcs_alive is whether that age is under
// the threshold. bridge_enabled is the effective value of the enabled key,
// so a consumer can tell a disabled bridge from a dead sim.
message Pong {
  bool dcs_alive = 1;
  optional uint64 dcs_last_heard_ms = 2;
  bool bridge_enabled = 3;
}

// Authentication, the second thing a connection does and the other message
// it may send before it has done so. It carries the token's secret and
// nothing else. The broker compares it against every configured token in
// constant time and answers with one AuthResult; after a failed one it
// closes the connection.
message Auth {
  string token = 1;
}

// What answers an Auth. ok true means everything else may follow, and the
// records the connection's capability set covers begin to arrive. ok false
// carries why, and the connection is closed after it.
message AuthResult {
  bool ok = 1;
  AuthError error = 2;
}

// Why an Auth failed.
//
// NEVER EMITTED at 0 on a failure. Not extensible: the broker produces every
// member. BAD_TOKEN is a secret no configured token carries. EMPTY_CAPABILITY_SET
// is a token that matched and can do nothing, which is a configuration mistake
// rather than a consumer's. SERVER_FULL is max_connections authenticated
// already.
enum AuthError {
  AUTH_ERROR_UNSPECIFIED = 0;
  AUTH_ERROR_BAD_TOKEN = 1;
  AUTH_ERROR_EMPTY_CAPABILITY_SET = 2;
  AUTH_ERROR_SERVER_FULL = 3;
}

// Asks for the FileDescriptorSet the broker serves. Requires
// authentication: unauthenticated, it would disclose the whole API surface
// to a port scan.
message GetSchema {}

// What answers a GetSchema: the compiled FileDescriptorSet the hook driver
// handed the broker, whose SHA-256 the handshake carries. Until the hand-off
// there is no set to serve, and error says so instead; exactly one of the
// two is set.
message Schema {
  optional bytes file_descriptor_set = 1;
  optional string error = 2;
}

// Consumer to broker: the highest seq this consumer has durably processed.
// Consumed by the broker and answered by nothing. Nothing reads the number
// until the replay spool ships; the record is on the wire now so that the
// spool changes nothing on it.
message SeqAck {
  uint64 seq = 1;
}

// The kill switch: sets the effective value of the enabled key. Handled by
// the broker itself and never reaches Lua, so a re-enable arrives while
// dispatch is down. Answered by nothing; its effect is Pong's bridge_enabled.
// It stops every record on the server, which is what a capability exists to
// gate, so it carries reload where the other broker-handled messages carry
// none.
message SetEnabled {
  option (required_capability) = CAPABILITY_RELOAD;

  bool enabled = 1;
}

// The drop policy the broker applies to a record under pressure.
//
// Not extensible: the broker implements each member, so a new class is a
// broker change rather than a schema one.
enum RecordClass {
  RECORD_CLASS_UNSPECIFIED = 0;
  RECORD_CLASS_DURABLE = 1;
  RECORD_CLASS_LOSSY = 2;
  RECORD_CLASS_COMMAND = 3;
  RECORD_CLASS_LIFECYCLE = 4;
}

// The Lua state a message routes to.
//
// EMITTED at 0: an unspecified target is generated into the sim driver route
// set. Not extensible: the broker implements each target.
enum Target {
  TARGET_UNSPECIFIED = 0;
  TARGET_SIM_DRIVER = 1;
  TARGET_HOOK_DRIVER = 2;
}

// The permission a connection needs before the broker accepts a message.
//
// NEVER EMITTED at 0: the generator refuses a message that names no
// capability. Extensible, so its numbers are partitioned: the bridge takes 1
// to 49 and defines three members and no more, the built-in sets share 50 to
// 99, and an adopter numbers from 100 upward.
enum Capability {
  CAPABILITY_UNSPECIFIED = 0;
  CAPABILITY_READ = 1;
  CAPABILITY_COMMAND = 2;
  CAPABILITY_RELOAD = 3;
}

// Why the broker refused a message it otherwise understood.
//
// NEVER EMITTED at 0. Not extensible: the broker produces every member.
enum RejectedReason {
  REJECTED_REASON_UNSPECIFIED = 0;
  REJECTED_REASON_UNKNOWN_TOPIC = 1;
  REJECTED_REASON_NO_CAPABILITY = 2;
  REJECTED_REASON_RATE_LIMITED = 3;
  REJECTED_REASON_BUSY = 4;
}

// The acknowledgement: what answers a command when no typed reply does. A
// read that fails, a mutation that succeeds or fails, and a duplicate all
// come back as one of these, addressed to the connection that sent the
// command. A handler sends it with begin_to, and it is the one point-to-point
// record the bridge itself defines, so the broker knows it by name.
//
// request_id and idempotency_key are optional because absence is meaningful
// and zero is a value: a read carries the first, a mutation the second, and
// a mutation that declares a typed reply carries both.
message CommandAck {
  option (record_class) = RECORD_CLASS_DURABLE;

  // Set on a read, absent on a mutation.
  optional uint64 request_id = 1;
  // Set on a mutation, absent on a read.
  optional string idempotency_key = 2;
  CommandAckOutcome outcome = 3;
  // Short, for a person reading a log. The emitting handler truncates it.
  string detail = 4;
}

// How a command ended. A consumer that meets a member it does not know
// treats it as FAILED.
//
// NEVER EMITTED at 0. Extensible, so its numbers are partitioned the way
// Capability's are: the bridge takes 1 to 49, the built-in sets 50 to 99, and
// an adopter numbers from 100 upward.
enum CommandAckOutcome {
  COMMAND_ACK_OUTCOME_UNSPECIFIED = 0;
  COMMAND_ACK_OUTCOME_OK = 1;
  COMMAND_ACK_OUTCOME_FAILED = 2;
  COMMAND_ACK_OUTCOME_DUPLICATE = 3;
  COMMAND_ACK_OUTCOME_REFUSED = 4;
}

// The four options every record carries. The generator reads them and writes
// the class, route and capability tables the broker registers, which is how a
// broker that holds no schema still applies drop policy, routes by target and
// enforces capabilities.
//
// Protobuf reserves extension numbers 50000 to 99999 for internal use.
extend google.protobuf.MessageOptions {
  RecordClass record_class = 50001;
  // On a request message, names the reply message.
  string reply_to = 50002;
  Target target = 50003;
  Capability required_capability = 50004;
}
