syntax = "proto3";

package dcs.builtin;

import "dcs/bridge/bridge.proto";

// The built-in sets' records. Package names partition the topic space: the
// bridge's own records live in dcs.bridge, both built-in sets' here, and an
// adopter's in a package they own. A topic id is its payload's
// fully-qualified type name, so the package is the partition.
//
// tools/schema-ownership.sh polices the other side of that line, keeping
// anything but the bridge's own records out of dcs.bridge.

// A unit left the mission. The first record, and the shape every other one
// follows.
message UnitDestroyed {
  option (dcs.bridge.record_class) = RECORD_CLASS_DURABLE;

  string unit_name = 1;
  int32 coalition = 2;
}
