syntax = "proto3";

package dcs.builtin;

import "dcs/bridge/bridge.proto";

// The built-in sets' records. SPEC 8.2 partitions the topic space by package
// name: the bridge's own records live in dcs.bridge, both built-in sets' here,
// and an adopter's in a package they own. A topic id is its payload's
// fully-qualified type name, so the package is the partition.
//
// SPEC 8.4 polices the other side of that line. Only the SPEC 1.2 records may
// live in dcs.bridge, and tools/schema-ownership.sh enforces it.

// A unit left the mission. The first record, and the shape every other one
// follows.
message UnitDestroyed {
  option (dcs.bridge.record_class) = RECORD_CLASS_DURABLE;

  string unit_name = 1;
  int32 coalition = 2;
}
